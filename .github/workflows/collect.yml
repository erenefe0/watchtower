name: Collect news
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_run:
    workflows: [Deploy Watchtower]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: watchtower-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'erenefe0/watchtower' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/d1-http.test.mjs
      - run: node scripts/collect.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7fb43cc9c8b895eb9b55744a7a0324ff
