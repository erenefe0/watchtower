name: Deploy Watchtower

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchtower-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'erenefe0/watchtower' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Migrate D1 and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7fb43cc9c8b895eb9b55744a7a0324ff
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          npx wrangler deploy
